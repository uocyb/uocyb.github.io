<!DOCTYPE html>
<html>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret | University of Oregon Cybersecurity Club</title>
    <link rel="shortcut icon" href="media/images/uoseclogo.svg" />
    <link href="styles/styles.css" rel="stylesheet">
    <script src="scripts/bg.js"></script>
</head>

<body>
    <div class="background"></div>
    <img class="bird" src="media/images/uoseclogo.svg" alt="bird-img">
    <div class="message">
        Press Enter To Start Game!
    </div>
    <div class="score">
        <span class="score_title"></span>
        <span class="score_val"></span>
    </div>

    <a class="portfolio-link" href="https://jdsmithartwork.com" target="_blank">
        jdsmithartwork.com
    </a>

    <a style="transform: rotate(180deg)" class="back-button" href="index.html">❯</a>
</body>

</html>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        width: 100vw;
    }

    .background {
        height: 100vh;
        width: 100vw;
        background-color: #154733;
    }

    .bird {
        width: 80px;
        position: fixed;
        top: 40vh;
        left: 30vw;
        z-index: 100;
        filter: invert();
    }

    .pipe_sprite {
        position: fixed;
        top: 40vh;
        left: 100vw;
        height: 70vh;
        width: 6vw;
        background-color: #FEE123;
        box-shadow: 20px -20px 15px rgba(13, 15, 22, 0.25);
    }

    .message {
        position: fixed;
        z-index: 10;
        height: 10vh;
        font-size: 10vh;
        font-weight: 100;
        font-family: United Sans;
        color: rgb(255, 255, 255);
        top: 12vh;
        left: 20vw;
        text-align: center;
    }

    .score {
        position: fixed;
        z-index: 10;
        height: 10vh;
        font-size: 9vh;
        font-weight: 100;
        font-family: United Sans;
        color: rgb(255, 255, 255);
        bottom: 15px;
        left: 30px;
    }

    .score_val {
        font-family: United Sans;
        color: rgb(255, 255, 255);
    }

    .portfolio-link {
        position: fixed;
        bottom: 10px;
        right: 15px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.25);
        text-decoration: none;
        font-family: Arial, sans-serif;
        transition: 0.15s;
    }

    .portfolio-link:hover {
        color: rgba(255, 255, 255, 0.8);
    }

    .back-button {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;

    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 20px;
    padding: 10px 20px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 100px;
    background: rgba(0,0,0,0.15);
    transition: 0.15s ease;
}

.back-button:hover {
    color: white;
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
}
</style>

<script>
    let move_speed = 6;
    let gravity = 0.5;

    let bird = document.querySelector('.bird');
    let score_val = document.querySelector('.score_val');
    let message = document.querySelector('.message');
    let score_title = document.querySelector('.score_title');

    let background = document.querySelector('.background');

    let game_state = 'Start';
    let bird_dy = 0;

    // FLAP CONTROL
    document.addEventListener('keydown', (e) => {

        // START / RESTART
        if (e.key === 'Enter') {

            if (game_state === 'Play')
                return;

            // Remove old pipes
            document.querySelectorAll('.pipe_sprite').forEach((e) => e.remove());

            // Reset bird
            bird.style.top = '40vh';
            bird_dy = 0;

            // Reset UI
            score_val.innerHTML = '0';
            score_title.innerHTML = 'Score : ';
            message.innerHTML = '';

            game_state = 'Play';

            play();
        }

        // FLAP
        if ((e.key === 'ArrowUp' || e.key === ' ') && game_state === 'Play') {
            bird_dy = -10;
        }
    });

    function endGame() {
        game_state = 'End';
        message.innerHTML = 'Press Enter To Restart';
        message.style.left = '22vw';
    }

    function play() {

        function move() {

            if (game_state !== 'Play')
                return;

            let pipe_sprite = document.querySelectorAll('.pipe_sprite');
            let bird_props = bird.getBoundingClientRect();

            pipe_sprite.forEach((element) => {

                let pipe_props = element.getBoundingClientRect();

                // Remove offscreen pipes
                if (pipe_props.right <= 0) {
                    element.remove();
                }

                // Collision
                else if (
                    bird_props.left < pipe_props.left + pipe_props.width &&
                    bird_props.left + bird_props.width > pipe_props.left &&
                    bird_props.top < pipe_props.top + pipe_props.height &&
                    bird_props.top + bird_props.height > pipe_props.top
                ) {
                    endGame();
                }

                // Score
                else if (
                    pipe_props.right < bird_props.left &&
                    pipe_props.right + move_speed >= bird_props.left &&
                    element.increase_score == '1'
                ) {
                    score_val.innerHTML = +score_val.innerHTML + 1;
                }

                element.style.left = pipe_props.left - move_speed + 'px';
            });

            requestAnimationFrame(move);
        }

        requestAnimationFrame(move);

        function apply_gravity() {

            if (game_state !== 'Play')
                return;

            let bird_props = bird.getBoundingClientRect();

            bird_dy += gravity;

            bird.style.top = bird_props.top + bird_dy + 'px';

            bird_props = bird.getBoundingClientRect();

            // TOP/BOTTOM COLLISION FIX
            if (
                bird_props.top <= 0 ||
                bird_props.bottom >= window.innerHeight
            ) {
                endGame();
                return;
            }

            requestAnimationFrame(apply_gravity);
        }

        requestAnimationFrame(apply_gravity);

        let pipe_seperation = 0;
        let pipe_gap = 35;

        function create_pipe() {

            if (game_state !== 'Play')
                return;

            if (pipe_seperation > 115) {

                pipe_seperation = 0;

                let pipe_posi = Math.floor(Math.random() * 43) + 8;

                // TOP PIPE
                let pipe_sprite_inv = document.createElement('div');

                pipe_sprite_inv.className = 'pipe_sprite';
                pipe_sprite_inv.style.top = pipe_posi - 70 + 'vh';
                pipe_sprite_inv.style.left = '100vw';

                document.body.appendChild(pipe_sprite_inv);

                // BOTTOM PIPE
                let pipe_sprite = document.createElement('div');

                pipe_sprite.className = 'pipe_sprite';
                pipe_sprite.style.top = pipe_posi + pipe_gap + 'vh';
                pipe_sprite.style.left = '100vw';

                pipe_sprite.increase_score = '1';

                document.body.appendChild(pipe_sprite);
            }

            pipe_seperation++;

            requestAnimationFrame(create_pipe);
        }

        requestAnimationFrame(create_pipe);
    }
</script>
