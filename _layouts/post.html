---
layout: default
---
<div class="post">
	<div class="title">{{ page.title }}</div>
	<p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}</p>

	<div class="post-content">
		{{ content }}
	</div>

	<p class="post-back"><a href="/blog.html">&larr; Back to all posts</a></p>
</div>
